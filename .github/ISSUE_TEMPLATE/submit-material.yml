name: 提交材料
description: 有新的可验证内容（视频、公告、代码、账单、接口返回）
title: "[材料] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [收录规则](../../blob/main/CONTRIBUTING.md)。

        一句话核对标准：**这条内容，一个陌生人能不能在十分钟内自己复核？**

  - type: textarea
    id: fact
    attributes:
      label: 发生了什么
      description: 只写事实。不写「说明」「证明」「所以」。时间、账号、数字尽量精确。
      placeholder: |
        2026-10-24 12:00，XX 发布了《……》，播放 1,234。
      render: text
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 来源
      description: URL、BV 号、commit SHA、接口地址，任选其一并写全。
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: snapshot
    attributes:
      label: 原始材料
      description: |
        如果出处可能失效（动态会删、视频会下架、网页会改），请附上原始文件或粘贴原始返回。
        可直接拖进这个输入框上传。
    validations:
      required: false

  - type: dropdown
    id: confidence
    attributes:
      label: 你能确认到什么程度
      options:
        - 已核实：有原始材料，任何人可复现
        - 待核准：有来源，但只有单一来源
        - 存疑：多个来源互相矛盾
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这条内容不含推断、归因或动机猜测
          required: true
        - label: 这条内容来自公开发布（不是私信或未公开聊天记录）
          required: true
        - label: 我同意按 CC0 1.0 释出这条内容
          required: true
